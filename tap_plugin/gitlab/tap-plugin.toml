manifest_version = "0"
plugin_version = "0.2.0"
requires_tap = ">=0.2.2"
slug = "gitlab"
name = "TAP GitLab"
description = "GitLab as grid vocabulary: a small self-managed GitLab as deployed (its components, Gitaly, runners and what they run on and store to) and the objects a FedRAMP operator governs in it (groups, projects, users, runners, protected branches and environments, CI/CD variables, keys and tokens, sign-in providers, audit streams), with a /gitlab page per instance."

# Vocabulary dependencies (Tier 1b): no Python imports. identity_core owns the OIDC issuer an SSO provider
# trusts (TRUSTS_ISSUER__identity_core) and the human an account is held by (HELD_BY_HUMAN__identity_core); aws_core owns the load-balancer edge the /gitlab page's ingress
# scene search names (ROUTES_TRAFFIC__aws_core). This plugin's own edges leave the AWS side open.
depends_on = [
    { slug = "identity_core", min_version = "0.1.3", note = "Vocabulary dependency: an OIDC sign-in provider trusts an identity_core__oidc_issuer through identity_core's TRUSTS_ISSUER edge (req-gitlab-edges-application), and gitlab__gitlab_user declares HELD_BY_HUMAN__identity_core to identity_core__human, the one person every system's account resolves to (req-gitlab-person-link)." },
    { slug = "aws_core", note = "Vocabulary dependency: the /gitlab page's ingress search names ROUTES_TRAFFIC__aws_core (a load balancer routing to a GitLab component), and the page draws aws_core nodes that GitLab processes run on and store to (req-gitlab-page)." },
]

# Pure Python, no dependencies, no crypto (spec-fips.md, req-tap-plugin-manifest-v0-fips).
[fips]
status = "compatible"

