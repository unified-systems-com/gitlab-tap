# Nightly self-test (Stage 4 of unified-systems-com/tap#363, req-tap-plugin-extdev-repo-ci).
#
# Two questions, two lanes. The plugin's push/PR lane (ci.yml) proves the plugin at its
# declared core FLOOR — the reproducible check. This nightly asks the other question,
# "will the next core break us?": the same reusable workflow against core `main`, the
# only row. There is deliberately no "latest core release" row: the floor is proven on
# every push, and a release is too late to be early warning — a hardcoded release ref
# also goes stale and reds the whole run on a question nobody is asking. A red `main`
# row files or updates ONE open issue for the owner; the next green closes it. A schedule is not
# evidence — GitHub may delay or skip scheduled runs — so the run itself is the record.
name: nightly
on:
  schedule:
    - cron: "54 10 * * *"   # minute staggered per repo so the org's nightlies do not burst
  workflow_dispatch:
permissions:
  contents: read
jobs:
  main:
    name: vs core main
    # Every job of plugin-ci is checked against this grant before any starts; its SARIF
    # upload job asks for security-events: write, so it is granted here, and a job-level
    # block replaces the workflow-level one, so contents: read is restated (tap#772).
    # Nothing in plugin-ci holds contents: write at or past this pin (tap#822).
    permissions:
      contents: read
      security-events: write
    # Pinned to unified-systems-com/tap main at d0e3991f8d19272118a0a0d51c16df55c5adbb58 (2026-09-25).
    uses: unified-systems-com/tap/.github/workflows/plugin-ci.yml@210409a20ad44e6f747f01bf6da9ccd2cbc04015
    with:
      plugin_slug: gitlab
      harness_ref: main
    secrets:
      harness_pat: ${{ secrets.TAP_CORE_RO_PAT }}
  owner-issue:
    name: file or close the owner issue
    needs: [main]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN_RESULT: ${{ needs.main.result }}
      TITLE: "Nightly red vs core main"
      ASSIGNEE: notgeorge   # no CODEOWNERS in this repo — the org's maintainer login
    steps:
      - name: Red main files or updates one issue; green main closes it
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")"
          if [ "$MAIN_RESULT" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Green again vs core main: $run_url."
            fi
            echo "vs core main: green"
            exit 0
          fi
          body="$(printf '%s\n\n%s' "The nightly run of this plugin against core \`main\` is **$MAIN_RESULT**: $run_url" "The push/PR lane proves the declared floor; this row proves the next core. Owner: fix the plugin (keep the floor), or raise the floor if the fix needs a newer core. This issue closes itself on the next green nightly.")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still red: $run_url."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body" --assignee "$ASSIGNEE"
          fi
          echo "::error::vs core main is $MAIN_RESULT — see $run_url"
          exit 1
