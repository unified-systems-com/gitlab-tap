# Thin caller of core's reusable per-repo CI (req-tap-plugin-extdev-repo-ci). Two pins,
# independent (req-tap-plugin-extdev-repo-ci-9): the `uses:` SHA pins WHICH validation
# logic runs; the plugin's manifest `requires_tap` pins WHICH core it runs against.
# The in-package tap_plugin/gitlab/boot/ci.boot.json IS the opt-in (req-boot-bootstrap-ci-record-6).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tap:
    # plugin-ci's submit-dependency-snapshot job holds contents: write (tap#664); a caller that
    # does not grant it fails at startup — every job, not just that one.
    permissions:
      contents: write
      # plugin-ci from tap#822 on uploads its dependency scan as SARIF, and GitHub checks every
      # permission a called workflow's jobs declare before any job starts, so security-events:
      # write is granted ahead of the pin moving there. contents: write stays while the pin
      # predates tap#822 (submit-dependency-snapshot needs it); drop it once the pin is past #822.
      security-events: write
    # Pinned to unified-systems-com/tap main at 422a56be3abe8dc63630394aac5ea9622eb70a99 (2026-09-22).
    uses: unified-systems-com/tap/.github/workflows/plugin-ci.yml@210409a20ad44e6f747f01bf6da9ccd2cbc04015
    with:
      plugin_slug: gitlab
    secrets:
      harness_pat: ${{ secrets.TAP_CORE_RO_PAT }}
